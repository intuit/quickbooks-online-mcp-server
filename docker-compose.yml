version: '3.8'

services:
  quickbooks-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Required: QuickBooks realm ID
      QUICKBOOKS_REALM_ID: ${QUICKBOOKS_REALM_ID}

      # Optional: Environment (sandbox or production)
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}

      # Optional: HTTP port
      PORT: ${PORT:-8000}

      # Transport mode (streamable-http for Docker)
      MCP_TRANSPORT: streamable-http

    # Restart policy for production
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
